<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Nuevo Producto - ABL Solutions</title>

    <link rel="stylesheet" href="../style.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Nunito:wght@200..1000&display=swap" rel="stylesheet">

    <link rel="icon" href="../img/logo_ABL.jpeg" type="image/jpeg">
</head>

<body>

    <!-- HEADER -->

    <section class="header">

        <div>

            <h1 class="tituloEmpresa">
                <i class='bx bx-buildings'></i>
                A.B.L Solutions
            </h1>

            <p class="parrafo_principal">
                Administración moderna de inventario y productos.
            </p>

        </div>

        <img
            class="logo-header"
            src="../img/logo_ABL.jpeg"
            alt="Logo ABL">

    </section>

    <!-- TITULO -->

    <section class="factura-header">

        <h1 class="factura-title">
            <i class='bx bx-package'></i>
            Nuevo Producto
        </h1>

        <p class="factura-subtitle">
            Agrega productos al inventario de manera organizada.
        </p>

    </section>

    <!-- CONTENIDO -->

    <div class="cliente-container">

        <form>

            <div class="form-grid">

                <!-- NOMBRE -->

                <div class="form-row">

                    <label>
                        <i class='bx bx-box'></i>
                        Nombre del Producto
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        required>

                </div>

                <!-- CODIGO -->

                <div class="form-row">

                    <label>
                        <i class='bx bx-barcode'></i>
                        Código
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        required>

                </div>

                <!-- PRECIO -->

                <div class="form-row">

                    <label>
                        <i class='bx bx-dollar-circle'></i>
                        Precio Base
                    </label>

                    <input
                        type="number"
                        id="precio_base"
                        required>

                </div>

                <!-- IMPUESTO -->

                <div class="form-row">

                    <label>
                        <i class='bx bx-receipt'></i>
                        Impuesto
                    </label>

                    <select
                        id="impuesto"
                        required>

                        <option value="iva">
                            IVA 19%
                        </option>

                        <option value="excluido">
                            Excluido
                        </option>

                    </select>

                </div>

            </div>

            <!-- DESCRIPCION -->

            <div class="form-row">

                <label>
                    <i class='bx bx-detail'></i>
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    rows="4"
                    required></textarea>

            </div>

            <!-- AVANZADO -->

            <div class="advanced-toggle">

                <input
                    type="checkbox"
                    id="checkAvanzado"
                    onchange="ClickCamposAvanzados()">

                <label for="checkAvanzado">

                    <i class='bx bx-cog'></i>

                    Mostrar formulario avanzado

                </label>

            </div>

            <!-- CAMPOS AVANZADOS -->

            <div
                id="camposAvanzados"
                hidden>

                <div class="advanced-card">

                    <h3>

                        <i class='bx bx-cube'></i>

                        Configuración avanzada

                    </h3>

                    <div class="form-grid">

                        <div class="form-row">

                            <label>
                                Categoría
                            </label>

                            <input
                                type="text"
                                placeholder="Categoría">

                        </div>

                        <div class="form-row">

                            <label>
                                Código de barras
                            </label>

                            <input
                                type="text"
                                placeholder="Código de barras">

                        </div>

                        <div class="form-row">

                            <label>
                                Unidad de medida
                            </label>

                            <select id="unidad_medida">

                                <option selected disabled>
                                    Seleccione
                                </option>

                                <optgroup label="Unidad">

                                    <option>
                                        Unidad
                                    </option>

                                </optgroup>

                                <optgroup label="Longitud">

                                    <option>
                                        Centímetro
                                    </option>

                                    <option>
                                        Metro
                                    </option>

                                    <option>
                                        Kilómetro
                                    </option>

                                </optgroup>

                                <optgroup label="Volumen">

                                    <option>
                                        Litro
                                    </option>

                                    <option>
                                        Mililitro
                                    </option>

                                </optgroup>

                                <optgroup label="Peso">

                                    <option>
                                        Gramo
                                    </option>

                                    <option>
                                        Kilogramo
                                    </option>

                                    <option>
                                        Libra
                                    </option>

                                </optgroup>

                            </select>

                        </div>

                        <div class="form-row">

                            <label>
                                Cantidad inicial
                            </label>

                            <input
                                type="number"
                                placeholder="0">

                        </div>

                        <div class="form-row">

                            <label>
                                Cantidad mínima
                            </label>

                            <input
                                type="number"
                                placeholder="0">

                        </div>

                        <div class="form-row">

                            <label>
                                Factor de conversión
                            </label>

                            <select>

                                <option selected disabled>
                                    No aplica
                                </option>

                                <option>
                                    Caja
                                </option>

                                <option>
                                    Paquete
                                </option>

                                <option>
                                    Unidad
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>

            <!-- BOTONES -->

            <div class="acciones-finales">

                <button type="submit">

                    <i class='bx bx-save'></i>

                    Guardar Producto

                </button>

                <button type="reset">

                    <i class='bx bx-x-circle'></i>

                    Cancelar

                </button>

                <button
                    type="button"
                    onclick="window.location.href='productos.html'">

                    <i class='bx bx-arrow-back'></i>

                    Volver

                </button>

            </div>

        </form>

    </div>

    <section class="footer">

        <p>
            ABL Solutions ® 2026 - Todos los derechos reservados
        </p>

    </section>

    <script src="../productos.js"></script>

</body>

</html>
