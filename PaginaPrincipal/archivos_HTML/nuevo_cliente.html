<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Cliente - ABL Solutions</title>

    <link rel="stylesheet" href="../style.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Nunito:wght@200..1000&display=swap" rel="stylesheet">

    <link rel="icon" href="../img/logo_ABL.jpeg" type="image/jpeg">
</head>

<body>

    <button class="modo" id="modoBtn">
        <i class='bx bx-moon'></i>
    </button>

    <!-- HEADER -->

    <section class="header">

        <div>
            <h1 class="tituloEmpresa">
                <i class='bx bx-buildings'></i>
                A.B.L Solutions
            </h1>

            <p class="parrafo_principal">
                Registro y administración de clientes.
            </p>
        </div>

        <img
            class="logo-header"
                <script src="../darkMode.js"></script>
            src="../img/logo_ABL.jpeg"
            alt="Logo ABL">

    </section>

    <!-- TITULO -->

    <section class="factura-header">

        <h1 class="factura-title">
            <i class='bx bx-user-plus'></i>
            Nuevo Cliente
        </h1>

        <p class="factura-subtitle">
            Complete la información para registrar un nuevo cliente.
        </p>

    </section>

    <div class="cliente-container">

        <!-- BOTONES -->

        <div class="factura-buttons" style="margin-bottom:25px;">

            <button
                type="button"
                onclick="window.location.href='clientes.html'">

                <i class='bx bx-arrow-back'></i>
                Volver

            </button>

        </div>

        <!-- FORMULARIO -->

        <form>

            <div class="form-grid">

                <div class="form-row">
                    <label>
                        <i class='bx bx-id-card'></i>
                        Tipo de identificación
                    </label>

                    <select
                        id="tipo_identificacion"
                        onchange="validarCampos()">

                        <option>Cédula de ciudadanía</option>
                        <option>Cédula de extranjería</option>
                        <option>Documento de identificación extranjero</option>
                        <option value="nit">NIT</option>
                        <option value="nit_otro">NIT de otro país</option>
                        <option>NUIP</option>
                        <option>Pasaporte</option>
                        <option>PEP</option>
                        <option>Permiso de protección temporal</option>
                        <option>Registro civil</option>
                        <option>Tarjeta de extranjería</option>
                        <option>Tarjeta de identidad</option>

                    </select>
                </div>

                <div class="form-row">
                    <label>
                        <i class='bx bx-hash'></i>
                        Número identificación
                    </label>

                    <input type="text">
                </div>

                <div class="form-row">
                    <label>
                        <i class='bx bx-user'></i>
                        Primer nombre
                    </label>

                    <input
                        type="text"
                        id="primer_nombre">
                </div>

                <div class="form-row">
                    <label>
                        Segundo nombre
                    </label>

                    <input
                        type="text"
                        id="segundo_nombre">
                </div>

                <div class="form-row">
                    <label>
                        Primer apellido
                    </label>

                    <input
                        type="text"
                        id="primer_apellido">
                </div>

                <div class="form-row">
                    <label>
                        Segundo apellido
                    </label>

                    <input
                        type="text"
                        id="segundo_apellido">
                </div>

                <div class="form-row">
                    <label>
                        Naturaleza
                    </label>

                    <select id="naturaleza">

                        <option>
                            Persona jurídica
                        </option>

                        <option>
                            Persona natural
                        </option>

                    </select>
                </div>

                <div class="form-row">
                    <label>
                        Nombre comercial
                    </label>

                    <input
                        type="text"
                        id="nombre_comercial">
                </div>

                <div class="form-row">
                    <label>
                        Razón social
                    </label>

                    <input
                        type="text"
                        id="razon_social">
                </div>

                <div class="form-row">
                    <label>
                        Dígito verificación
                    </label>

                    <input
                        type="text"
                        id="dv">
                </div>

                <div class="form-row">
                    <label>
                        Responsabilidad tributaria
                    </label>

                    <select>

                        <option>IVA</option>
                        <option>INC</option>
                        <option>IVA e INC</option>
                        <option>No aplica</option>

                    </select>
                </div>

                <div class="form-row">
                    <label>
                        Correo electrónico
                    </label>

                    <input type="email">
                </div>

            </div>

            <!-- PROVEEDOR -->

            <details class="premium-details">

                <summary>
                    <i class='bx bx-store'></i>
                    Información de proveedor
                </summary>

                <div class="details-content">

                    <div class="form-row">

                        <label>
                            Tipo proveedor
                        </label>

                        <select id="tipo_proveedor">

                            <option>Residente</option>
                            <option>No residente</option>
                            <option>No aplica</option>

                        </select>

                    </div>

                </div>

            </details>

            <!-- FORMULARIO AVANZADO -->

            <details class="premium-details">

                <summary>
                    <i class='bx bx-cog'></i>
                    Formulario avanzado
                </summary>

                <div class="details-content">

                    <div class="form-grid">

                        <div class="form-row">
                            <label>Dirección</label>
                            <input type="text">
                        </div>

                        <div class="form-row">
                            <label>Ciudad</label>
                            <input type="text">
                        </div>

                        <div class="form-row">
                            <label>Celular</label>
                            <input type="text">
                        </div>

                        <div class="form-row">
                            <label>Teléfono fijo</label>
                            <input type="text">
                        </div>

                        <div class="form-row">
                            <label>Correo contacto</label>
                            <input type="email">
                        </div>

                    </div>

                    <div class="acciones-direccion">

                        <button type="button">

                            <i class='bx bx-plus'></i>
                            Agregar dirección

                        </button>

                        <button type="button">

                            <i class='bx bx-trash'></i>
                            Eliminar dirección

                        </button>

                    </div>

                </div>

            </details>

            <!-- BOTONES -->

            <div class="acciones-finales">

                <button type="submit">

                    <i class='bx bx-save'></i>
                    Guardar Cliente

                </button>

                <button type="reset">

                    <i class='bx bx-x'></i>
                    Cancelar

                </button>

            </div>

        </form>

    </div>

<script>

function validarCampos() {

    let tipo = document.getElementById("tipo_identificacion").value;

    let primerNombre = document.getElementById("primer_nombre");
    let segundoNombre = document.getElementById("segundo_nombre");
    let primerApellido = document.getElementById("primer_apellido");
    let segundoApellido = document.getElementById("segundo_apellido");

    let razonSocial = document.getElementById("razon_social");
    let dv = document.getElementById("dv");

    if(tipo == "nit" || tipo == "nit_otro"){

        primerNombre.value = "No aplica";
        segundoNombre.value = "No aplica";
        primerApellido.value = "No aplica";
        segundoApellido.value = "No aplica";

        razonSocial.value = "";
        dv.value = "";

    }else{

        razonSocial.value = "No aplica";
        dv.value = "No aplica";

        primerNombre.value = "";
        segundoNombre.value = "";
        primerApellido.value = "";
        segundoApellido.value = "";

    }
}

</script>

</body>
</html>
